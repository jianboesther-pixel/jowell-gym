<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // 纸墨主题：语言固定简体中文，方向永远 LTR。
  try {
    document.documentElement.lang = 'zh';
    document.documentElement.dir = 'ltr';
  } catch (e) {}
</script>
<title>JoWell健身</title>
<meta name="description" content="JoWell 健身 · 训练与体重记录">
<meta name="theme-color" content="#f7f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JoWell健身">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json?v=2" crossorigin="use-credentials">
<link rel="apple-touch-icon" sizes="180x180" href="icon-jowell-180.png?v=2">
<link rel="apple-touch-icon" href="icon-jowell-180.png?v=2">
<link rel="icon" type="image/png" href="favicon-jowell.png?v=2">
</head>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
